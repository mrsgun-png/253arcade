<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>크레이지 아케이드 - 여름 해변 보물찾기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght=700&display=swap');
        
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 0; background: #0f1a2e; color: #fff;
            font-family: 'Black Han Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px;
        }

        .app-container { width: 100%; max-width: 440px; position: relative; }

        .arcade-box {
            background: #1a2c4e; border: 4px solid #00f0ff; border-radius: 16px; padding: 16px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); text-align: center; margin-bottom: 10px;
        }
        .title-flash {
            font-size: 1.8rem; color: #ffea00;
            text-shadow: 3px 3px 0 #ff0077, 5px 5px 0 #000;
            margin: 5px 0 10px 0;
        }

        .select-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 240px; overflow-y: auto; margin-bottom: 12px; padding-right: 4px;
        }
        .select-card {
            background: rgba(255,255,255,0.05); border: 2px solid #555; border-radius: 10px;
            padding: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left;
        }
        .select-card.selected { border-color: #ff0077; background: rgba(255,0,119,0.2); }
        .card-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ffea00; object-fit: cover; flex-shrink: 0; }

        /* 크아 여름 해변 테마 맵 */
        .map-grid {
            display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px;
            background: #d4a373; border: 4px solid #00b4d8; border-radius: 12px; padding: 6px; margin: 10px 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .map-cell {
            aspect-ratio: 1; 
            background: linear-gradient(135deg, #f6d59b, #e0a96d); 
            border: 2px solid #b07d4f;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.3);
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center; font-size: 10px; cursor: pointer; position: relative;
            color: #5c4033; font-weight: bold;
        }
        .map-cell.ocean-block {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-color: #03045e;
            color: #fff;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -2px 4px rgba(0,0,0,0.5);
        }

        /* 야자수 & 파라솔 구조물 */
        .map-cell.obstacle {
            background: linear-gradient(135deg, #caf0f8, #90e0ef) !important;
            border-color: #0077b6 !important;
            cursor: not-allowed;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.8);
        }

        /* 이동 가능 칸 */
        .map-cell.movable { 
            background: linear-gradient(135deg, #ff0077, #ff5c8a) !important; 
            border: 3px dashed #ffea00 !important;
            color: #fff !important;
            animation: neonPulse 0.6s infinite alternate; 
        } 

        /* 어프로치 조사 가능 칸 */
        .map-cell.approachable { 
            background: linear-gradient(135deg, #00f0ff, #0077ff) !important; 
            border: 3px solid #ffea00 !important;
            color: #000 !important;
            animation: pulseApproach 0.8s infinite alternate; 
        } 

        .map-cell.start-select { border: 3px solid #ffea00 !important; background: #ff0077 !important; color: #fff; }

        @keyframes neonPulse {
            from { transform: scale(1); box-shadow: 0 0 5px #ff0077, inset 0 0 10px #fff; }
            to { transform: scale(1.08); box-shadow: 0 0 15px #ffea00, inset 0 0 15px #ffea00; }
        }

        @keyframes pulseApproach {
            from { background: linear-gradient(135deg, #00f0ff, #0077ff); }
            to { background: linear-gradient(135deg, #70d6ff, #00f0ff); }
        }

        .player-token {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; object-fit: cover;
            position: absolute; z-index: 10; box-shadow: 0 0 8px #000;
        }
        .player-token.trapped { filter: hue-rotate(240deg) saturate(300%); border-color: #00f0ff; }

        .arcade-msg-box {
            background: #000; border: 2px solid #00f0ff; color: #00f0ff; padding: 10px; margin: 8px 0;
            border-radius: 8px; font-size: 0.85rem; height: 55px; overflow-y: auto; display: flex; align-items: center;
            justify-content: center; text-align: center; box-shadow: inset 0 0 10px rgba(0,240,255,0.3);
        }

        .status-bar {
            display: flex; justify-content: space-around; background: rgba(0,0,0,0.4); padding: 6px;
            border-radius: 6px; font-size: 0.75rem; margin-bottom: 6px; border: 1px solid #4ade80; color: #a4e400;
        }

        .btn-main {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #ff0077, #ffea00);
            border: none; border-radius: 8px; color: #000; font-family: 'Black Han Sans', sans-serif;
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0 #b30054; margin-top: 6px;
        }
        .btn-main:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }

        .btn-action {
            flex: 1; padding: 10px; background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none; border-radius: 8px; color: #fff; font-family: 'Black Han Sans', sans-serif;
            font-size: 0.95rem; cursor: pointer; box-shadow: 0 3px 0 #0044b3;
        }
        .action-container { display: flex; gap: 8px; margin-top: 10px; }

        .dashboard-table { width: 100%; font-size: 0.8rem; border-collapse: collapse; margin-top: 8px; }
        .dashboard-table th, .dashboard-table td { border: 1px solid #334155; padding: 6px; text-align: center; }
        .dashboard-table th { background: #1e3a8a; color: #ffea00; }
        
        .admin-reset-btn {
            margin-top: 15px; font-size: 0.75rem; color: #666; background: none; border: none; 
            text-decoration: underline; cursor: pointer; font-family: 'Black Han Sans', sans-serif;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- 1. 캐릭터 선택 및 시작 위치 지정 화면 -->
        <div id="setup-screen" class="arcade-box">
            <div class="title-flash">🏖️ 크아 여름 해변 맵 🏖️</div>
            <div id="setup-instruction" style="font-size:0.85rem; color:#00f0ff; margin-bottom:10px;">
                1️⃣ 캐릭터를 골라주세요! (이름 선택)
            </div>

            <div class="select-grid" id="name-select-container"></div>
            
            <div id="char-select-section" style="display:none;">
                <div style="font-size:0.85rem; color:#ffea00; margin-bottom:6px;">
                    2️⃣ 게임 캐릭터를 골라주세요!
                </div>
                <div class="select-grid" id="char-select-container"></div>
            </div>
            
            <div id="map-select-section" style="display:none;">
                <div style="font-size:0.85rem; color:#ffea00; margin-bottom:6px;">
                    3️⃣ 해변 맵에서 시작할 위치를 선택하세요! (야자수 구조물 피하기)
                </div>
                <div class="map-grid" id="setup-map-grid" style="max-width:340px; margin: 0 auto;"></div>
            </div>

            <button class="btn-main" id="start-adventure-btn" onclick="confirmAdventureStart()" disabled>
                해변 모험 시작하기!
            </button>
            <br>
            <button class="admin-reset-btn" onclick="adminReset()">🛠️ 관리자: 데이터 초기화</button>
        </div>

        <!-- 2. 실시간 게임 본 화면 -->
        <div id="game-screen" class="arcade-box" style="display:none;">
            <div class="user-top-bar" style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.3); padding:8px; border-radius:8px; margin-bottom:10px;">
                <div style="display:flex; align-items:center; gap:6px;">
                    <img id="my-game-avatar" style="width:28px; height:28px; border-radius:50%; border:1px solid #ffea00;" alt="avatar">
                    <span style="font-size:0.95rem;"><b id="my-game-info" style="color:#ffea00;">-- --</b></span>
                </div>
                <span id="player-status-badge" style="font-size:0.75rem; background:#15803d; padding:3px 8px; border-radius:10px;">게임 중 🟢</span>
            </div>

            <div class="title-flash" style="font-size:1.4rem;">이번주 GOAL = CR 30%</div>
            
            <div class="status-bar" id="item-status-bar">
                <span id="stat-treasure">🎁 남은 보물: 5개</span>
                <span id="stat-trap">💥 남은 함정: 3개</span>
                <span id="stat-event">✨ 남은 이벤트: 5개</span>
            </div>

            <div class="map-grid" id="game-map-grid"></div>

            <div class="arcade-msg-box" id="arcade-msg">
                [안내] 크아 여름 해변 맵에 입장했습니다! 야자수와 파라솔을 피해 보물을 찾으세요.
            </div>

            <div class="action-container">
                <button class="btn-action" onclick="doApproach()">🔍 어프로치<br>(어프로치 1회)</button>
                <button class="btn-action" style="background:linear-gradient(135deg, #10b981, #059669); box-shadow:0 3px 0 #047857;" onclick="doSale()">👣 판매 성공<br>(이동권 획득)</button>
            </div>

            <div style="margin-top:15px; background:rgba(0,0,0,0.4); padding:10px; border-radius:10px; border:1px solid #00f0ff;">
                <div style="font-size:0.9rem; color:#ffea00; margin-bottom:6px;">🏆 크아 전기간 누적 대시보드</div>
                <table class="dashboard-table">
                    <thead>
                        <tr>
                            <th>플레이어</th>
                            <th>어프로치</th>
                            <th>판매</th>
                            <th>보물발견</th>
                            <th>누적상금</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard-tbody"></tbody>
                </table>
            </div>
            <br>
            <button class="admin-reset-btn" onclick="adminReset()">🛠️ 관리자: 데이터 초기화</button>
        </div>

    </div>

<script>
    const FIREBASE_URL = "https://arcade-2ed34-default-rtdb.firebaseio.com/"; 
    
    function getTodayString() {
        const now = new Date();
        const utcNow = now.getTime() + (now.getTimezoneOffset() * 60000); 
        const koreaTimeDiff = 9 * 60 * 60 * 1000;
        const koreaNow = new Date(utcNow + koreaTimeDiff);
        return `${koreaNow.getFullYear()}-${String(koreaNow.getMonth() + 1).padStart(2, '0')}-${String(koreaNow.getDate()).padStart(2, '0')}`;
    }
    const todayStr = getTodayString();

    // 13명의 팀원 (진호, 영서 포함)
    const teamNames = ["윤정", "유진", "지인", "혜인", "성경", "채령", "주하", "정환", "선우", "재민", "한솔", "진호", "영서"];
    
    // 크아 캐릭터 8종
    const arcadeCharacters = [
        { name: "다오", img: "다오.PNG" },
        { name: "디지니", img: "디지니.PNG" },
        { name: "마리드", img: "마리드.PNG" },
        { name: "모스", img: "모스.PNG" },
        { name: "배찌", img: "배찌.PNG" },
        { name: "에띠", img: "에띠.PNG" },
        { name: "우니", img: "우니.PNG" },
        { name: "케피", img: "케피.PNG" }
    ];

    let selectedName = null;
    let selectedCharObj = null;
    let selectedStartPos = null;
    let myName = localStorage.getItem('arcade_treasure_user');
    let myMovesLeft = 0;        
    let myApproachesLeft = 0;   

    function showArcadeMessage(msg, color = "#00f0ff") {
        const box = document.getElementById('arcade-msg');
        if (box) {
            box.style.color = color;
            box.innerText = msg;
        }
    }

    function initSetup() {
        renderNameSelection();
        if (myName) {
            checkUserAlreadyStartedToday();
        }
    }

    function renderNameSelection() {
        const grid = document.getElementById('name-select-container');
        if (!grid) return;
        grid.innerHTML = "";
        
        teamNames.forEach((name, idx) => {
            grid.innerHTML += `
                <div class="select-card" id="name-card-${idx}" onclick="selectNameItem('${name}', ${idx})">
                    <div style="width:36px; height:36px; border-radius:50%; background:#00f0ff; color:#000; display:flex; justify-content:center; align-items:center; font-weight:bold;">👤</div>
                    <span><b>${name}</b></span>
                </div>
            `;
        });
    }

    function selectNameItem(name, idx) {
        document.querySelectorAll('#name-select-container .select-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`name-card-${idx}`).classList.add('selected');
        selectedName = name;

        document.getElementById('setup-instruction').innerText = "2️⃣ 게임 캐릭터를 골라주세요!";
        document.getElementById('char-select-section').style.display = 'block';
        renderCharSelection();
    }

    function renderCharSelection() {
        const grid = document.getElementById('char-select-container');
        if (!grid) return;
        grid.innerHTML = "";

        arcadeCharacters.forEach((char, idx) => {
            grid.innerHTML += `
                <div class="select-card" id="char-card-${idx}" onclick="selectCharItem('${char.name}', '${char.img}', ${idx})">
                    <img class="card-img" src="${char.img}" onerror="this.src='https://img.icons8.com/color/48/circled-user-female-skin-type-4--v1.png'" alt="${char.name}">
                    <span><b>${char.name}</b></span>
                </div>
            `;
        });
    }

    function selectCharItem(charName, charImg, idx) {
        document.querySelectorAll('#char-select-container .select-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`char-card-${idx}`).classList.add('selected');
        selectedCharObj = { name: charName, img: charImg };

        document.getElementById('setup-instruction').innerText = "3️⃣ 해변 맵에서 시작할 위치를 선택하세요! (야자수 구조물 피하기)";
        document.getElementById('map-select-section').style.display = 'block';
        renderSetupMap();
    }

    function renderSetupMap() {
        const mapGrid = document.getElementById('setup-map-grid');
        if (!mapGrid) return;
        mapGrid.innerHTML = "";

        const obstacles = [10, 22, 36, 44, 58, 70, 18, 62, 4, 76];
        const obstacleIcons = ["🌴", "⛱️", "🌴", "⛱️", "🌴", "⛱️", "🌴", "⛱️", "🌴", "⛱️"];

        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'map-cell';
            
            if (i % 4 === 0 || i % 4 === 3) {
                cell.classList.add('ocean-block');
            }

            const obsIdx = obstacles.indexOf(i);
            if (obsIdx !== -1) {
                cell.classList.add('obstacle');
                cell.innerText = obstacleIcons[obsIdx];
            } else {
                cell.innerText = i;
                cell.onclick = () => {
                    document.querySelectorAll('#setup-map-grid .map-cell').forEach(c => c.classList.remove('start-select'));
                    cell.classList.add('start-select');
                    selectedStartPos = i;
                    document.getElementById('start-adventure-btn').disabled = false;
                    document.getElementById('start-adventure-btn').innerText = `[${selectedName} / ${selectedCharObj.name}] 시작하기!`;
                };
            }
            mapGrid.appendChild(cell);
        }
    }

    function confirmAdventureStart() {
        if (!selectedName || !selectedCharObj || selectedStartPos === null) return;
        myName = selectedName;
        localStorage.setItem('arcade_treasure_user', myName);

        // 1. 전기간 누적 데이터 가져와서 기본 정보 갱신 (누적치 영구 보존)
        fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`).then(res => res.json()).then(existing => {
            const userCumulative = {
                name: myName,
                characterName: selectedCharObj.name,
                avatar: selectedCharObj.img,
                approach_count: existing && existing.approach_count !== undefined ? Number(existing.approach_count) : 0,
                sale_count: existing && existing.sale_count !== undefined ? Number(existing.sale_count) : 0,
                treasure_found: existing && existing.treasure_found !== undefined ? Number(existing.treasure_found) : 0,
                total_won: existing && existing.total_won !== undefined ? Number(existing.total_won) : 0
            };

            // 2. 오늘의 세션 데이터(맵 위치 & 상태) 생성 (오늘 출근한 사람만 맵에 등장)
            const todaySession = {
                name: myName,
                characterName: selectedCharObj.name,
                avatar: selectedCharObj.img,
                position: Number(selectedStartPos) || 0,
                status: 'active',
                trap_count: 0
            };

            Promise.all([
                fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`, { method: 'PUT', body: JSON.stringify(userCumulative) }),
                fetch(`${FIREBASE_URL}arcade_daily_sessions/${todayStr}/${myName}.json`, { method: 'PUT', body: JSON.stringify(todaySession) })
            ]).then(() => {
                checkAndInitDailyMap();
            });
        });
    }

    // 오늘 이미 출근 등록했는지 체크
    function checkUserAlreadyStartedToday() {
        fetch(`${FIREBASE_URL}arcade_daily_sessions/${todayStr}/${myName}.json`).then(res => res.json()).then(todayData => {
            if (todayData && todayData.position !== undefined) {
                selectedName = todayData.name;
                selectedCharObj = { name: todayData.characterName, img: todayData.avatar };
                startMainGame();
            } else {
                // 날짜가 바뀌었으면 오늘 새로 캐릭터를 고르고 시작 위치를 잡을 수 있게 함
                document.getElementById('setup-screen').style.display = 'block';
                document.getElementById('game-screen').style.display = 'none';
            }
        }).catch(() => {
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
        });
    }

    function checkAndInitDailyMap() {
        fetch(`${FIREBASE_URL}arcade_treasure_map/${todayStr}.json`).then(res => res.json()).then(mapData => {
            if (!mapData || !mapData.cells) {
                const obstacles = [10, 22, 36, 44, 58, 70, 18, 62, 4, 76];
                let indices = Array.from({length: 81}, (_, i) => i).filter(i => !obstacles.includes(i));
                indices.sort(() => Math.random() - 0.5);
                
                const cellsMap = {};
                for(let i=0; i<5; i++) cellsMap[indices[i]] = 'treasure';     
                for(let i=5; i<8; i++) cellsMap[indices[i]] = 'trap';         
                for(let i=8; i<13; i++) cellsMap[indices[i]] = 'event';       

                const initialMap = {
                    cells: cellsMap,
                    obstacles: obstacles
                };

                fetch(`${FIREBASE_URL}arcade_treasure_map/${todayStr}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(initialMap)
                }).then(() => startMainGame());
            } else {
                startMainGame();
            }
        });
    }

    function startMainGame() {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        if (selectedCharObj) {
            document.getElementById('my-game-avatar').src = selectedCharObj.img;
            document.getElementById('my-game-info').innerText = `${selectedName} ${selectedCharObj.name}`;
        }

        syncGameData();
        setInterval(syncGameData, 3000);
    }

    function syncGameData() {
        Promise.all([
            fetch(`${FIREBASE_URL}arcade_treasure_users.json`).then(res => res.json()),              // 1. 전기간 누적 기록
            fetch(`${FIREBASE_URL}arcade_daily_sessions/${todayStr}.json`).then(res => res.json()), // 2. 오늘 출근자 세션(맵 위치)
            fetch(`${FIREBASE_URL}arcade_treasure_map/${todayStr}.json`).then(res => res.json())    // 3. 오늘의 맵 데이터
        ]).then(([cumulativeUsers, todaySessions, mapData]) => {
            mapData = mapData || { cells: {}, obstacles: [] };
            renderGameMap(todaySessions || {}, mapData);
            renderDashboard(cumulativeUsers || {});
            updateMyStatus(todaySessions && todaySessions[myName] ? todaySessions[myName] : null);
        }).catch(err => console.log("Sync error:", err));
    }

    function updateMyStatus(mySession) {
        if (!mySession) return;
        const badge = document.getElementById('player-status-badge');
        if (!badge) return;
        if (mySession.status === 'trapped') {
            badge.innerText = `물풍선 갇힘! (판매 ${mySession.trap_count}/2 필요) 💧`;
            badge.style.background = '#dc2626';
        } else if (myMovesLeft > 0) {
            badge.innerText = `이동 가능 (${myMovesLeft}회) ✨`;
            badge.style.background = '#eab308';
        } else if (myApproachesLeft > 0) {
            badge.innerText = `조사 가능 (${myApproachesLeft}회) 🔍`;
            badge.style.background = '#0284c7';
        } else {
            badge.innerText = '게임 중 🟢';
            badge.style.background = '#15803d';
        }
    }

    function renderGameMap(todaySessions, mapData) {
        const grid = document.getElementById('game-map-grid');
        if (!grid) return;
        grid.innerHTML = "";

        const cellsInfo = mapData.cells || {};
        const obstacles = mapData.obstacles || [10, 22, 36, 44, 58, 70, 18, 62, 4, 76];
        const obstacleIcons = ["🌴", "⛱️", "🌴", "⛱️", "🌴", "⛱️", "🌴", "⛱️", "🌴", "⛱️"];
        const mySession = todaySessions[myName];
        const myPos = mySession ? Number(mySession.position) : null;

        let tCount = 0, trapCount = 0, eCount = 0;
        Object.values(cellsInfo).forEach(val => {
            if (val === 'treasure') tCount++;
            if (val === 'trap') trapCount++;
            if (val === 'event') eCount++;
        });

        document.getElementById('stat-treasure').innerText = `🎁 남은 보물: ${tCount}개`;
        document.getElementById('stat-trap').innerText = `💥 남은 함정: ${trapCount}개`;
        document.getElementById('stat-event').innerText = `✨ 남은 이벤트: ${eCount}개`;

        if (tCount === 0 && Object.keys(cellsInfo).length > 0) {
            showArcadeMessage("🏆 모든 보물을 찾았습니다! 게임 완료!", "#ffea00");
        }

        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'map-cell';
            
            if (i % 4 === 0 || i % 4 === 3) {
                cell.classList.add('ocean-block');
            }

            const obsIdx = obstacles.indexOf(i);
            if (obsIdx !== -1) {
                cell.classList.add('obstacle');
                cell.innerText = obstacleIcons[obsIdx];
                cell.onclick = () => {
                    if (myMovesLeft > 0 && isAdjacent(myPos, i)) {
                        showArcadeMessage("🌴 야자수 및 파라솔 구조물이라 지나갈 수 없습니다!", "#ff4d4d");
                    }
                };
            } else {
                if (myMovesLeft > 0 && myPos !== null && isAdjacent(myPos, i) && !obstacles.includes(i)) {
                    cell.classList.add('movable');
                    cell.onclick = () => executeMove(i);
                } else if (myApproachesLeft > 0) {
                    cell.classList.add('approachable');
                    cell.onclick = () => executeApproach(i);
                } else {
                    cell.onclick = null;
                }
            }

            // 오늘 접속한 플레이어만 맵에 토큰으로 표시
            if (todaySessions) {
                Object.values(todaySessions).forEach(p => {
                    if (p && Number(p.position) === i && p.name) {
                        const token = document.createElement('img');
                        token.className = `player-token ${p.status === 'trapped' ? 'trapped' : ''}`;
                        token.src = p.avatar || '다오.PNG';
                        token.title = `${p.name} (${p.characterName})`;
                        token.alt = "token";
                        cell.appendChild(token);
                    }
                });
            }

            grid.appendChild(cell);
        }
    }

    function isAdjacent(pos1, pos2) {
        const r1 = Math.floor(pos1 / 9), c1 = pos1 % 9;
        const r2 = Math.floor(pos2 / 9), c2 = pos2 % 9;
        return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1 && pos1 !== pos2;
    }

    function executeMove(targetIdx) {
        if (myMovesLeft <= 0 || !myName) return;

        fetch(`${FIREBASE_URL}arcade_treasure_map/${todayStr}.json`).then(res => res.json()).then(mapData => {
            mapData = mapData || { obstacles: [] };
            const obstacles = mapData.obstacles || [];

            if (obstacles.includes(targetIdx)) {
                showArcadeMessage("🌴 야자수 및 파라솔 구조물이라 지나갈 수 없습니다!", "#ff4d4d");
                return;
            }

            Promise.all([
                fetch(`${FIREBASE_URL}arcade_daily_sessions/${todayStr}/${myName}.json`).then(res => res.json()),
                fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`).then(res => res.json())
            ]).then(([mySession, userCumul]) => {
                if (!mySession) {
                    mySession = {
                        name: selectedName || myName,
                        characterName: selectedCharObj ? selectedCharObj.name : "다오",
                        avatar: selectedCharObj ? selectedCharObj.img : "다오.PNG",
                        position: targetIdx,
                        status: 'active',
                        trap_count: 0
                    };
                } else {
                    mySession.position = targetIdx;
                }
                myMovesLeft--;

                userCumul = userCumul || {
                    name: myName,
                    characterName: selectedCharObj ? selectedCharObj.name : "다오",
                    avatar: selectedCharObj ? selectedCharObj.img : "다오.PNG",
                    approach_count: 0, sale_count: 0, treasure_found: 0, total_won: 0
                };

                const cellsInfo = mapData.cells || {};
                const cellType = cellsInfo[targetIdx];

                if (cellType === 'treasure') {
                    userCumul.treasure_found = (Number(userCumul.treasure_found) || 0) + 1;
                    
                    const rewards = [1000, 2000, 3000];
                    const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
                    userCumul.total_won = (Number(userCumul.total_won) || 0) + randomReward;

                    showArcadeMessage(`🎁 [보물 발견!] ${targetIdx}번 칸에서 코스머니 +${randomReward.toLocaleString()}원 획득!`, "#ffea00");
                    delete cellsInfo[targetIdx]; 
                } else if (cellType === 'trap') {
                    mySession.status = 'trapped';
                    mySession.trap_count = 0;
                    showArcadeMessage(`💥 [함정 당첨!] 물풍선에 갇혔습니다! 판매 2회로 탈출하세요!`, "#ff4d4d");
                    delete cellsInfo[targetIdx]; 
                } else if (cellType === 'event') {
                    const randEvt = Math.floor(Math.random() * 3);
                    if (randEvt === 0) {
                        myMovesLeft += 3;
                        showArcadeMessage(`✨ [이벤트 당첨!] 부스터 발동! 추가 이동 +3회!`, "#38bdf8");
                    } else if (randEvt === 1) {
                        myMovesLeft += 1;
                        showArcadeMessage(`✨ [이벤트 당첨!] 정찰 안경! 추가 이동 +1회!`, "#38bdf8");
                    } else {
                        myMovesLeft += 1;
                        showArcadeMessage(`✨ [이벤트 당첨!] 행운의 보너스! 추가 이동 +1회!`, "#38bdf8");
                    }
                    delete cellsInfo[targetIdx]; 
                } else {
                    showArcadeMessage(`👣 ${targetIdx}번 해변 칸으로 이동했습니다.`);
                }

                mapData.cells = cellsInfo;

                Promise.all([
                    fetch(`${FIREBASE_URL}arcade_daily_sessions/${todayStr}/${myName}.json`, { method: 'PUT', body: JSON.stringify(mySession) }),
                    fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`, { method: 'PUT', body: JSON.stringify(userCumul) }),
                    fetch(`${FIREBASE_URL}arcade_treasure_map/${todayStr}.json`, { method: 'PUT', body: JSON.stringify(mapData) })
                ]).then(() => syncGameData());
            });
        });
    }

    function executeApproach(targetIdx) {
        if (myApproachesLeft <= 0 || !myName) return;

        fetch(`${FIREBASE_URL}arcade_treasure_map/${todayStr}.json`).then(res => res.json()).then(mapData => {
            mapData = mapData || { cells: {}, obstacles: [] };
            const obstacles = mapData.obstacles || [];
            const cellsInfo = mapData.cells || {};
            const cellType = cellsInfo[targetIdx];

            myApproachesLeft--;

            let resultMsg = `🔍 [${targetIdx}번 칸 조사 결과] `;
            let textColor = "#38bdf8";

            if (obstacles.includes(targetIdx)) {
                resultMsg += "🌴 야자수 및 파라솔 구조물 지역입니다.";
                textColor = "#a0aec0";
            } else if (cellType === 'treasure') {
                resultMsg += "🎁 찬란한 보물의 기운이 감지됩니다!";
                textColor = "#ffea00";
            } else if (cellType === 'trap') {
                resultMsg += "💥 위험한 함정(물풍선)의 기운이 느껴집니다!";
                textColor = "#ff4d4d";
            } else if (cellType === 'event') {
                resultMsg += "✨ 신비로운 이벤트 기운이 감지됩니다!";
                textColor = "#38bdf8";
            } else {
                resultMsg += "아무것도 없는 안전한 빈 칸입니다.";
                textColor = "#a4e400";
            }
            showArcadeMessage(resultMsg, textColor);

            syncGameData();
        });
    }

    // 전기간 누적 대시보드 렌더링
    function renderDashboard(cumulativeUsers) {
        const tbody = document.getElementById('dashboard-tbody');
        if (!tbody) return;
        tbody.innerHTML = "";
        
        if (!cumulativeUsers || Object.keys(cumulativeUsers).length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="color:#aaa; text-align:center;">아직 플레이어 기록이 없습니다.</td></tr>`;
            return;
        }

        const sorted = Object.values(cumulativeUsers).filter(p => p && p.name).sort((a,b) => (b.treasure_found || 0) - (a.treasure_found || 0) || (b.sale_count || 0) - (a.sale_count || 0));
        
        if (sorted.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="color:#aaa; text-align:center;">기록이 없습니다.</td></tr>`;
            return;
        }

        sorted.forEach((p) => {
            tbody.innerHTML += `
                <tr style="${p.name === myName ? 'background:rgba(0,240,255,0.1); font-weight:bold;' : ''}">
                    <td>${p.name} (${p.characterName || '다오'})</td>
                    <td>${p.approach_count || 0}</td>
                    <td>${p.sale_count || 0}</td>
                    <td>🎁 ${p.treasure_found || 0}</td>
                    <td>${(p.total_won || 0).toLocaleString()}원</td>
                </tr>
            `;
        });
    }

    function doApproach() {
        if (!myName) return;
        fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`).then(res => res.json()).then(userCumul => {
            if(!userCumul) {
                userCumul = { name: myName, characterName: selectedCharObj ? selectedCharObj.name : "다오", avatar: selectedCharObj ? selectedCharObj.img : "다오.PNG", approach_count: 1, sale_count: 0, treasure_found: 0, total_won: 0 };
            } else {
                userCumul.approach_count = (Number(userCumul.approach_count) || 0) + 1;
            }
            myApproachesLeft += 1;
            
            showArcadeMessage("🔍 어프로치 성공! 해변 맵 전체 중 조사하고 싶은 칸을 클릭하세요.", "#38bdf8");

            fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`, {
                method: 'PUT',
                body: JSON.stringify(userCumul)
            }).then(() => syncGameData());
        });
    }

    function doSale() {
        if (!myName) return;
        Promise.all([
            fetch(`${FIREBASE_URL}arcade_daily_sessions/${todayStr}/${myName}.json`).then(res => res.json()),
            fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`).then(res => res.json())
        ]).then(([mySession, userCumul]) => {
            if(!mySession) {
                mySession = { name: myName, characterName: selectedCharObj ? selectedCharObj.name : "다오", avatar: selectedCharObj ? selectedCharObj.img : "다오.PNG", position: 0, status: 'active', trap_count: 0 };
            }
            if(!userCumul) {
                userCumul = { name: myName, characterName: selectedCharObj ? selectedCharObj.name : "다오", avatar: selectedCharObj ? selectedCharObj.img : "다오.PNG", approach_count: 0, sale_count: 0, treasure_found: 0, total_won: 0 };
            }

            userCumul.sale_count = (Number(userCumul.sale_count) || 0) + 1;

            if (mySession.status === 'trapped') {
                mySession.trap_count = (Number(mySession.trap_count) || 0) + 1;
                if (mySession.trap_count >= 2) {
                    mySession.status = 'active';
                    mySession.trap_count = 0;
                    showArcadeMessage("💧 물풍선 탈출 성공! 해변 이동권 1회가 주어집니다!", "#38bdf8");
                    myMovesLeft += 1;
                } else {
                    showArcadeMessage(`💧 판매 1회 완료! 함정 탈출까지 앞으로 판매 1번 남았습니다.`, "#ff4d4d");
                }
            } else {
                myMovesLeft += 1;
                showArcadeMessage("👣 판매 성공! 이동권 +1회 획득! 맵에서 이동할 인접한 칸을 클릭하세요.", "#a4e400");
            }

            Promise.all([
                fetch(`${FIREBASE_URL}arcade_daily_sessions/${todayStr}/${myName}.json`, { method: 'PUT', body: JSON.stringify(mySession) }),
                fetch(`${FIREBASE_URL}arcade_treasure_users/${myName}.json`, { method: 'PUT', body: JSON.stringify(userCumul) })
            ]).then(() => syncGameData());
        });
    }

    function adminReset() {
        const pwd = prompt("관리자 비밀번호를 입력하세요:");
        if (pwd === "253253") {
            if (confirm("정말로 모든 데이터를 초기화하시겠습니까? (누적 대시보드 포함)")) {
                Promise.all([
                    fetch(`${FIREBASE_URL}arcade_treasure_users.json`, { method: 'DELETE' }),
                    fetch(`${FIREBASE_URL}arcade_daily_sessions.json`, { method: 'DELETE' }),
                    fetch(`${FIREBASE_URL}arcade_treasure_map.json`, { method: 'DELETE' })
                ]).then(() => {
                    alert("초기화 완료!");
                    localStorage.removeItem('arcade_treasure_user');
                    location.reload();
                });
            }
        }
    }

    window.onload = initSetup;
</script>
</body>
